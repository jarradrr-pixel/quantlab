[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "quantlab"
version = "0.1.0"
description = "AI-assisted quantitative research and paper-trading system (research use only)"
requires-python = ">=3.12"
dependencies = [
  "fastapi==0.115.6",
  "uvicorn[standard]==0.34.0",
  "pydantic==2.10.4",
  "pydantic-settings==2.7.1",
  "sqlalchemy==2.0.36",
  "alembic==1.14.0",
  "psycopg[binary]==3.2.3",
  "jinja2==3.1.5",
  "itsdangerous==2.2.0",
  "argon2-cffi==23.1.0",
  "python-multipart==0.0.20",
  "httpx==0.28.1",
  "yfinance==0.2.51",
]

[tool.setuptools]
# Explicit, because flat-layout auto-discovery sees `app` and `alembic` as two
# top-level packages and refuses to guess. Migrations ship via the Dockerfile
# COPY, not as an installed package.
packages = ["app", "app.api", "app.brokers", "app.core", "app.db", "app.marketdata", "app.web"]

[tool.setuptools.package-data]
"app.web" = ["templates/*.html", "static/*"]

[project.optional-dependencies]
dev = [
  "pytest==8.3.4",
  "ruff==0.8.6",
  "mypy==1.14.1",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --strict-markers"
asyncio_default_fixture_loop_scope = "function"
filterwarnings = ["error::DeprecationWarning:app.*"]

[tool.ruff]
line-length = 95
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "S", "C4", "SIM", "RUF"]
ignore = ["S101"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S105", "S106"]
"alembic/*" = ["E501"]

[tool.mypy]
python_version = "3.12"
strict = true
plugins = []
ignore_missing_imports = true
exclude = "alembic/"

[[tool.mypy.overrides]]
module = "tests.*"
strict = false
