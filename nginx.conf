# Reverse-proxy rate limiting. app/rate_limit.py's RateLimiter is in-memory
# and per-process by design (see its module docstring) -- correct for a
# single worker, but multiple app workers or replicas would each keep an
# independent counter, multiplying the effective limit. nginx's limit_req
# zone lives in shared memory across nginx's own workers, so it is the real,
# authoritative limit for this deployment; the app's own limiter and account
# lockout (docs/security.md) remain in place underneath as defense in depth.
worker_processes 1;

events {
    worker_connections 1024;
}

http {
    # Keyed by client IP; 10m ~ enough entries for a small deployment.
    # Rate matches QUANTLAB_LOGIN_RATE_LIMIT's default (5/minute) -- if you
    # change that setting, update this to match.
    limit_req_zone $binary_remote_addr zone=login:10m rate=5r/m;

    server {
        listen 80;

        # $remote_addr is nginx's own view of the TCP peer, not a header the
        # client can set -- overwriting X-Forwarded-For with it (rather than
        # appending via $proxy_add_x_forwarded_for) means a client can never
        # inject a fake address that survives to the app.
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;

        location /login {
            limit_req zone=login burst=2 nodelay;
            limit_req_status 429;
            proxy_pass http://app:8000;
        }

        location / {
            proxy_pass http://app:8000;
        }
    }
}
